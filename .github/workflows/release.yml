name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Lua syntax
        run: |
          sudo apt-get install -y lua5.1 >/dev/null
          for f in Gulli-QuestCleaner/*.lua; do luac5.1 -p "$f"; done
      - name: Check version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## Version: $v$" Gulli-QuestCleaner/Gulli-QuestCleaner.toc || { echo "TOC version is not $v"; exit 1; }
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          zip -r "Gulli-QuestCleaner-$v-forever.zip" Gulli-QuestCleaner
          cat > release.json <<JSON
          {"releases":[{"name":"Gulli-QuestCleaner","version":"$v","filename":"Gulli-QuestCleaner-$v-forever.zip","nolib":false,"metadata":[{"flavor":"forever","interface":16001}]}]}
          JSON
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Gulli-QuestCleaner-$v-forever.zip" release.json --title "Gulli-QuestCleaner $v" --generate-notes
