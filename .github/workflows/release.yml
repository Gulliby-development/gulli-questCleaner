name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Lua syntax
        run: |
          sudo apt-get install -y lua5.1 >/dev/null
          for f in Gulli-QuestCleaner/*.lua; do luac5.1 -p "$f"; done
      - name: Read version
        run: |
          v=$(sed -n 's/^## Version: *//p' Gulli-QuestCleaner/Gulli-QuestCleaner.toc | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $v"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Package
        run: |
          zip -r "Gulli-QuestCleaner-$VERSION-forever.zip" Gulli-QuestCleaner
          printf '{"releases":[{"name":"Gulli-QuestCleaner","version":"%s","filename":"Gulli-QuestCleaner-%s-forever.zip","nolib":false,"metadata":[{"flavor":"forever","interface":16001}]}]}\n' "$VERSION" "$VERSION" > release.json
          cat release.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "Gulli-QuestCleaner-$VERSION-forever.zip" release.json \
            --target "$GITHUB_SHA" --title "Gulli-QuestCleaner $VERSION" --generate-notes
